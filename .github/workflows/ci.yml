name: Pioneer macOS Package
on:
  push:
    branches: [build/blackflow-opening-macos-20261024]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pioneer-macos-${{ github.ref }}
  cancel-in-progress: false
env:
  OPENING_VERSION: v6.0.0-opening.recovery4.20261024
jobs:
  core:
    name: Core (${{ matrix.arch }})
    runs-on: macos-26-intel
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
      - name: Fetch pinned dependencies
        run: git submodule update --init --depth 1 src/MaaUtils
      - uses: actions/cache@v6
        with:
          path: src/MaaUtils/MaaDeps
          key: opening-macos-${{ matrix.arch }}-deps-v214-${{ hashFiles('tools/maadeps-download.py') }}
      - name: Bootstrap native libraries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/maadeps-download.py ${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}-osx
      - name: Build opening Core
        run: |
          cmake -B build --preset ${{ matrix.arch == 'x86_64' && 'macos-publish-x64' || 'macos-publish-arm64' }} -DMAA_HASH_VERSION="$OPENING_VERSION"
          cmake --build build --config RelWithDebInfo --parallel 3
          cmake --install build --config RelWithDebInfo
      - name: Verify collection contract
        run: |
          cmake -S unit_test -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests --target maa-black-flow-data-collection-test --parallel 3
          ctest --test-dir build-tests --output-on-failure -R '^black-flow-data-collection::'
      - uses: actions/upload-artifact@v7
        with:
          name: opening-core-${{ matrix.arch }}
          path: install/*.dylib
          retention-days: 14
  package:
    name: Universal GUI and DMG
    needs: core
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
      - name: Fetch pinned GUI
        run: git submodule update --init --depth 1 src/MaaMacGui
      - uses: actions/download-artifact@v8
        with:
          name: opening-core-arm64
          path: install-arm64
      - uses: actions/download-artifact@v8
        with:
          name: opening-core-x86_64
          path: install-x86_64
      - name: Assemble universal frameworks
        run: |
          mkdir -p build release
          for lib in install-arm64/*.dylib; do
            name=$(basename "$lib")
            lipo -create "$lib" "install-x86_64/$name" -output "build/$name"
            lipo "build/$name" -verify_arch arm64 x86_64
          done
          cd build
          xcodebuild -create-xcframework -library libMaaCore.dylib -headers ../include -output MaaCore.xcframework
          xcodebuild -create-xcframework -library libMaaUtils.dylib -output MaaUtils.xcframework
          xcodebuild -create-xcframework -library libfastdeploy_ppocr.dylib -output fastdeploy_ppocr.xcframework
          xcodebuild -create-xcframework -library libonnxruntime.*.dylib -output ONNXRuntime.xcframework
          xcodebuild -create-xcframework -library libopencv*.dylib -output OpenCV.xcframework
      - name: Prepare dedicated opening app
        run: python3 tools/BlackFlowOpeningMac/prepare.py --version "$OPENING_VERSION"
      - name: Archive both GUI architectures
        working-directory: src/MaaMacGui
        run: |
          set -o pipefail
          xcodebuild CODE_SIGNING_ALLOWED=NO 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            PRODUCT_BUNDLE_IDENTIFIER=wiki.lubiao.MAAPioneer \
            -scheme MAA archive -archivePath MAA.xcarchive > ../../build/opening-xcode.log 2>&1 || { tail -100 ../../build/opening-xcode.log; exit 1; }
      - name: Package and verify
        run: |
          set -euo pipefail
          app=src/MaaMacGui/MAA.xcarchive/Products/Applications/MAA.app
          cp build-info-opening-macos.json "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          python3 tools/BlackFlowOpeningMac/verify.py --app "$app" --version "$OPENING_VERSION" --output release/macos-verification.json
          mkdir -p build/opening-dmg
          cp -R "$app" build/opening-dmg/MAAPioneer.app
          cp tools/BlackFlowOpeningMac/NOTICE.txt build/opening-dmg/使用说明.txt
          cp build-info-opening-macos.json build/opening-dmg/build-info.json
          ln -s /Applications build/opening-dmg/Applications
          python3 tools/BlackFlowOpeningMac/create_dmg.py --source build/opening-dmg \
            --volume 'MAA Pioneer recovery-v4' --output release/MAA-Pioneer-Opening-recovery-v4-20261024-macos-universal.dmg
          cp build-info-opening-macos.json release/
          cp tools/BlackFlowOpeningMac/NOTICE.txt release/使用说明.txt
          cd release
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opening-macos-build-log
          path: build/opening-xcode.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: MAA-Pioneer-macos-universal
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
